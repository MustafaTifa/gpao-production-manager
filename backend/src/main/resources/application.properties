#spring.profiles.active=prod
spring.application.name=somatel-liebherr

# --- Database (values come from environment variables, see .env.example) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/somatelliebherr}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name:org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# --- File storage (GED uploads) ---
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
spring.web.resources.static-locations=file:${FILE_UPLOAD_DIR:./uploads}/

server.port=${SERVER_PORT:8088}

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
