<h1>Poste de travaille</h1>
<form class="form-group" [formGroup]="WorkstationForm">
    <fieldset class="fieldset-container">
        <legend>{{action == 'create'? 'Ajouter' : 'Modifier'}} Poste de travaille</legend>
        <mat-form-field class="field" class="field" appearance="fill">
            <mat-label>Code Poste de travaille</mat-label>
            <input formControlName="codeWorkstation" matInput #input>
        </mat-form-field>

        <mat-form-field class="field" appearance="fill">
            <mat-label>Designation Poste de travaille</mat-label>
            <input formControlName="libelle" matInput #input>
        </mat-form-field>

        <mat-form-field class="field" appearance="fill">
            <mat-label>CFI</mat-label>
            <input type="text" matInput formControlName="cfi" [matAutocomplete]="auto">
            <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn">
                <mat-option *ngFor="let cfi of cfiOptions| async" [value]="cfi">{{cfi.codeCFI}} - {{cfi.libelle}}</mat-option>
            </mat-autocomplete>
        </mat-form-field>

        <mat-form-field class="field" appearance="fill">
            <mat-label>Observation</mat-label>
            <input formControlName="observation" matInput #input>
        </mat-form-field>
    </fieldset>
    <div class="action-buttons">
        <button class="btn" type="button" (click)="clearFields()" mat-raised-button>Nouveau</button>
        <button class="btn btn-add" type="button" (click)="onSubmit()" mat-raised-button>{{action == 'create'? 'Sauvegarder' : 'Modifier'}}</button>
    </div>
</form>
<div class="table-container">
    <soma-table [dataSource]="dataSource" [resultsLength]="resultsLength" [columns]="columns" [actions]="actions" [displayedColumns]="displayedColumns"
        (tableChanges)="onTableChanges($event)" (onActionClicked)="onActionClicked($event)">
        
    </soma-table>
</div>
